# ============================================================
# wacrm — VPS deployment
#
# Port 3060 is chosen because your VPS already binds
# 3000, 3001, 3050, 4200, 5001, 5555, 6379, 7000, 7001, 7005,
# 7007, 8000 and 27017. The app listens on 3060 *inside* the
# container too (PORT in the Dockerfile) — nothing uses 3000
# anywhere. To move it, change both sides of `ports` below and
# `PORT` in the Dockerfile so they stay in sync.
#
# Run with (note --env-file: it drives BOTH the build args and the
# runtime env from one file):
#
#   docker compose --env-file .env.local up -d --build
#
# ============================================================

services:
  wacrm:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the client bundle at build time,
      # so they must be passed here, not only at runtime. Edit one and
      # you must rebuild (`up -d --build`), not just restart.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE}

    image: wacrm:latest
    container_name: wacrm
    restart: unless-stopped

    # Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, ENCRYPTION_KEY,
    # META_APP_SECRET) are read at runtime — never baked into the image.
    env_file:
      - .env.local

    # Public hostname is https://wa.focasedu.online, terminated by the
    # proxy in front of this container — never by `next start` itself.
    #
    # Which binding you want depends on where that proxy lives:
    #
    #   - Proxy on the HOST (nginx / OpenLiteSpeed / host-installed
    #     Caddy): use "127.0.0.1:3060:3060". Loopback-only, so the app
    #     is unreachable at http://<vps-ip>:3060 and every request has
    #     to come through TLS.
    #
    #   - Proxy in a CONTAINER (the focas-crm-web Caddy container):
    #     a loopback publish is invisible to it — 127.0.0.1 inside that
    #     container is its own namespace. Join its network instead
    #     (see `networks` at the bottom) and proxy to `wacrm:3060`;
    #     the `ports` entry then becomes optional and can be dropped.
    #
    # "3060:3060" below binds 0.0.0.0 — the app is served unencrypted
    # on the public IP alongside the HTTPS hostname. Narrow it once the
    # proxy is wired up.
    ports:
      - "3060:3060"

    # Uncomment together with the top-level `networks:` block below to
    # put this container on the Caddy container's network.
    # networks:
    #   - proxy

    # `next start` has no dedicated health endpoint; the root route is
    # enough to prove the server is up and serving.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3060/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
# Only needed when the reverse proxy is itself a container. Find the
# real network name with:
#
#   docker inspect focas-crm-web \
#     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
#
# then put that name in `name:` below. `external: true` means compose
# attaches to the existing network rather than creating one.
#
# networks:
#   proxy:
#     external: true
#     name: <network-from-the-command-above>
